<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساحة الصوتية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --primary-glow: rgba(108, 99, 255, 0.3);
            --bg-dark: #0A0A1A;
            --bg-card: #141430;
            --bg-card-hover: #1E1E4A;
            --text-primary: #F0EEFF;
            --text-secondary: #A8A4D6;
            --text-muted: #5E5A8A;
            --border: #2A2A5A;
            --success: #00E676;
            --danger: #FF4081;
            --warning: #FFD740;
            --gold: #FFD700;
            --cohost: #00BCD4;
            --radius: 20px;
            --glow: 0 0 60px rgba(108, 99, 255, 0.15);
            --glow-strong: 0 0 80px rgba(108, 99, 255, 0.25);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(108, 99, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(108, 99, 255, 0.05) 0%, transparent 60%);
            overflow-x: hidden;
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(108, 99, 255, 0.08); top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: rgba(255, 64, 129, 0.06); bottom: -50px; right: -50px; animation-delay: -7s; }
        .orb-3 { width: 200px; height: 200px; background: rgba(0, 230, 118, 0.05); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 50px) scale(0.9); }
            100% { transform: translate(40px, -20px) scale(1.05); }
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.1;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .container {
            max-width: 540px;
            margin: 0 auto;
            padding: 20px 16px 30px;
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            padding: 24px 16px 20px;
            position: relative;
            margin-bottom: 24px;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 4px;
        }
        .header-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.2), rgba(108, 99, 255, 0.05));
            border: 2px solid rgba(108, 99, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.6rem;
            color: var(--primary);
            box-shadow: var(--glow);
            transition: var(--transition);
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--text-primary), var(--primary), var(--text-primary));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header .sub { color: var(--text-secondary); font-size: 0.75rem; margin-top: 4px; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-top: 10px;
            background: rgba(0, 230, 118, 0.08);
            color: var(--success);
            border: 1px solid rgba(0, 230, 118, 0.15);
        }
        .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulseDot 1.5s ease-in-out infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }
        .status-badge.inactive { background: rgba(255, 64, 129, 0.08); color: var(--danger); border-color: rgba(255, 64, 129, 0.15); }
        .status-badge.inactive .dot { background: var(--danger); }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 20px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--glow);
            backdrop-filter: blur(10px);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.3;
        }
        .card-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title i { color: var(--primary); }

        .room-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
        .room-controls .input-group { position: relative; }
        .room-controls .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            text-align: right;
        }
        .room-controls .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.06); }
        .room-controls .input-group input::placeholder { color: var(--text-muted); opacity: 0.5; }
        .room-controls .input-group .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .btn {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 25px rgba(108, 99, 255, 0.25); }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(108, 99, 255, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #D81B60); color: #fff; box-shadow: 0 4px 25px rgba(255, 64, 129, 0.25); }
        .btn-danger:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(255, 64, 129, 0.4); }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--text-primary); }
        .btn-success { background: linear-gradient(135deg, var(--success), #00C853); color: #000; box-shadow: 0 4px 25px rgba(0, 230, 118, 0.2); }
        .btn-success:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0, 230, 118, 0.3); }
        .btn-cohost { background: linear-gradient(135deg, var(--cohost), #00838F); color: #fff; box-shadow: 0 4px 25px rgba(0, 188, 212, 0.2); }
        .btn-cohost:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0, 188, 212, 0.3); }
        .btn-sm { padding: 6px 12px; font-size: 0.7rem; border-radius: 8px; width: auto; display: inline-flex; }
        .btn .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .room-info { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); animation: fadeIn 0.4s ease; }
        .room-info.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .info-item {
            background: var(--bg-dark);
            border-radius: 10px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .info-item .number { font-size: 1.1rem; font-weight: 900; color: var(--primary); line-height: 1.2; }
        .info-item .number.green { color: var(--success); }
        .info-item .number.danger { color: var(--danger); }
        .info-item .number.gold { color: var(--gold); }
        .info-item .number.cohost { color: var(--cohost); }
        .info-item .label { font-size: 0.5rem; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

        .action-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .action-row .btn { flex: 1; min-width: 80px; padding: 10px 12px; font-size: 0.75rem; }

        .participants {
            max-height: 140px;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 2px;
        }
        .participants::-webkit-scrollbar { width: 3px; }
        .participants::-webkit-scrollbar-track { background: var(--bg-dark); border-radius: 4px; }
        .participants::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .participant-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 10px;
            background: var(--bg-dark);
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: var(--transition);
        }
        .participant-item:hover { border-color: var(--border); }
        .participant-item .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #fff;
            flex-shrink: 0;
        }
        .participant-item .avatar.host { background: linear-gradient(135deg, var(--gold), #F9A825); }
        .participant-item .avatar.cohost { background: linear-gradient(135deg, var(--cohost), #00838F); }
        .participant-item .avatar.self { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        .participant-item .avatar.listener { background: var(--text-muted); }
        .participant-item .avatar.speaker { background: linear-gradient(135deg, var(--success), #00C853); }
        .participant-item .name { flex: 1; font-size: 0.78rem; font-weight: 600; }
        .participant-item .name .me { font-size: 0.5rem; color: var(--text-muted); font-weight: 400; margin-right: 4px; }
        .participant-item .role {
            font-size: 0.5rem;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .participant-item .role.host { background: rgba(255, 215, 0, 0.15); color: var(--gold); }
        .participant-item .role.cohost { background: rgba(0, 188, 212, 0.15); color: var(--cohost); }
        .participant-item .role.speaker { background: rgba(0, 230, 118, 0.12); color: var(--success); }
        .participant-item .role.listener { background: rgba(255, 255, 255, 0.04); color: var(--text-muted); }

        .participant-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .participant-actions button {
            padding: 2px 8px;
            border-radius: 6px;
            border: none;
            font-size: 0.55rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .participant-actions button:hover { border-color: var(--primary); color: var(--text-primary); }
        .participant-actions button.cohost-btn:hover { border-color: var(--cohost); color: var(--cohost); }
        .participant-actions button.kick-btn:hover { border-color: var(--danger); color: var(--danger); }
        .participant-actions button.speaker-btn:hover { border-color: var(--success); color: var(--success); }

        .share-section { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); animation: fadeIn 0.4s ease; }
        .share-section.active { display: block; }
        .share-section .link-box {
            display: flex;
            gap: 6px;
            background: var(--bg-dark);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid var(--border);
        }
        .share-section .link-box input {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 0.7rem;
            outline: none;
            direction: ltr;
            text-align: left;
        }
        .share-section .link-box button {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            font-size: 0.7rem;
            white-space: nowrap;
        }
        .share-section .link-box button:hover { background: var(--primary-dark); }
        .share-buttons { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .share-buttons button {
            flex: 1;
            min-width: 60px;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-dark);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .share-buttons button:hover { border-color: var(--primary); color: var(--text-primary); }
        .share-buttons .whatsapp { border-color: #25D366; color: #25D366; }
        .share-buttons .whatsapp:hover { background: rgba(37, 211, 102, 0.08); }
        .share-buttons .telegram { border-color: #0088cc; color: #0088cc; }
        .share-buttons .telegram:hover { background: rgba(0, 136, 204, 0.08); }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 20px;
            max-width: 380px;
            width: 92%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-box .icon { font-size: 2rem; color: var(--primary); text-align: center; margin-bottom: 8px; }
        .modal-box h3 { font-size: 1.1rem; text-align: center; }
        .modal-box .sub { text-align: center; color: var(--text-secondary); font-size: 0.75rem; margin-bottom: 14px; }
        .modal-box .input-group { position: relative; margin-bottom: 12px; }
        .modal-box .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            text-align: center;
            letter-spacing: 3px;
            font-weight: 700;
        }
        .modal-box .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.06); }
        .modal-box .modal-actions { display: flex; gap: 8px; }
        .modal-box .modal-actions .btn { flex: 1; padding: 10px; font-size: 0.8rem; }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-ghost:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

        .footer {
            text-align: center;
            padding: 18px 16px 6px;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.6rem;
            letter-spacing: 0.5px;
            border-top: 1px solid var(--border);
        }
        .footer span { color: var(--primary); }

        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 92%;
            max-width: 400px;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
            width: 100%;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }
        .toast.success { border-right: 4px solid var(--success); }
        .toast.error { border-right: 4px solid var(--danger); }
        .toast.info { border-right: 4px solid var(--primary); }
        .toast.warning { border-right: 4px solid var(--warning); }
        .toast.cohost { border-right: 4px solid var(--cohost); }

        @media (max-width: 480px) {
            .container { padding: 12px 10px 20px; }
            .card { padding: 18px 14px; }
            .header h1 { font-size: 1.2rem; }
            .header-icon { width: 50px; height: 50px; font-size: 1.3rem; }
            .info-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; }
            .info-item { padding: 6px 4px; }
            .info-item .number { font-size: 0.9rem; }
            .action-row { flex-wrap: wrap; }
            .action-row .btn { min-width: 60px; font-size: 0.65rem; padding: 8px 10px; }
            .participant-item { padding: 4px 10px; gap: 6px; }
            .participant-item .avatar { width: 24px; height: 24px; font-size: 0.6rem; }
            .participant-item .name { font-size: 0.7rem; }
            .share-buttons button { font-size: 0.6rem; padding: 6px; }
            .modal-box { padding: 18px 14px; }
        }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>

    <div class="container">

        <header class="header">
            <div class="header-icon"><i class="fas fa-microphone-alt"></i></div>
            <h1>المساحة الصوتية</h1>
            <div class="sub"><i class="fas fa-circle" style="font-size:0.3rem;vertical-align:middle;"></i> غرف صوتية خاصة مع مساعدين</div>
            <div class="status-badge" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">جاهز</span>
            </div>
        </header>

        <div class="card">

            <div class="room-controls" id="roomControls">
                <div class="card-title"><i class="fas fa-door-open"></i> التحكم بالغرفة</div>
                <div class="input-group">
                    <input type="text" id="roomPasswordInput" placeholder="كلمة مرور الغرفة (اختياري)" dir="ltr">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                </div>
                <button class="btn btn-primary" id="createRoomBtn" onclick="createRoom()">
                    <i class="fas fa-plus-circle"></i> إنشاء الغرفة
                </button>
                <button class="btn btn-outline" id="joinRoomBtn" onclick="showJoinModal()" style="display:none;">
                    <i class="fas fa-sign-in-alt"></i> الانضمام إلى غرفة
                </button>
            </div>

            <div class="room-info" id="roomInfo">
                <div class="card-title" style="margin-bottom:8px;">
                    <i class="fas fa-users"></i> الغرفة الحالية
                    <span style="margin-right:auto;font-size:0.6rem;color:var(--text-muted);font-weight:400;" id="roomIdDisplay"></span>
                </div>
                <div class="info-grid">
                    <div class="info-item"><div class="number" id="participantCount">0</div><div class="label">المشاركون</div></div>
                    <div class="info-item"><div class="number green" id="speakerCount">0</div><div class="label">متحدثين</div></div>
                    <div class="info-item"><div class="number gold" id="hostCount">0</div><div class="label">المسؤولين</div></div>
                    <div class="info-item"><div class="number cohost" id="cohostCount">0</div><div class="label">المساعدين</div></div>
                </div>

                <div class="action-row">
                    <button class="btn btn-success" id="toggleMicBtn" onclick="toggleMic()">
                        <i class="fas fa-microphone"></i> كتم
                    </button>
                    <button class="btn btn-danger" onclick="closeRoom()">
                        <i class="fas fa-door-closed"></i> إغلاق
                    </button>
                    <button class="btn btn-cohost" id="cohostPanelBtn" onclick="toggleCohostPanel()" style="display:none;">
                        <i class="fas fa-user-plus"></i> مساعدين
                    </button>
                </div>

                <div id="cohostPanel" style="display:none;background:var(--bg-dark);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid rgba(0,188,212,0.15);">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <span style="font-size:0.7rem;color:var(--cohost);font-weight:700;"><i class="fas fa-user-cog"></i> إدارة المساعدين</span>
                        <span style="font-size:0.55rem;color:var(--text-muted);">يمكن للمساعدين كتم وإدارة المشاركين</span>
                    </div>
                    <div id="cohostList" style="max-height:80px;overflow-y:auto;"></div>
                </div>

                <div class="participants" id="participantsList"></div>
            </div>

            <div class="share-section" id="shareSection">
                <div class="card-title" style="margin-bottom:8px;"><i class="fas fa-share-alt"></i> دعوة الأصدقاء</div>
                <div class="link-box">
                    <input type="text" id="inviteLinkInput" readonly>
                    <button onclick="copyInviteLink()"><i class="fas fa-copy"></i> نسخ</button>
                </div>
                <div class="share-buttons">
                    <button class="whatsapp" onclick="shareWhatsApp()"><i class="fab fa-whatsapp"></i> واتساب</button>
                    <button class="telegram" onclick="shareTelegram()"><i class="fab fa-telegram"></i> تيليجرام</button>
                    <button onclick="copyInviteLink()"><i class="fas fa-link"></i> نسخ</button>
                </div>
            </div>

        </div>

        <footer class="footer"><span>✦</span> مساحة صوتية خاصة <span>✦</span></footer>
    </div>

    <!-- ===== Join Modal ===== -->
    <div class="modal-overlay" id="joinModal">
        <div class="modal-box">
            <div class="icon"><i class="fas fa-sign-in-alt"></i></div>
            <h3>الانضمام إلى غرفة</h3>
            <div class="sub">أدخل رمز الغرفة وكلمة المرور</div>
            <div class="input-group">
                <input type="text" id="joinRoomIdInput" placeholder="رمز الغرفة" dir="ltr" style="text-align:center;letter-spacing:2px;">
            </div>
            <div class="input-group">
                <input type="password" id="joinPasswordInput" placeholder="كلمة المرور (اختياري)" dir="ltr" style="text-align:center;letter-spacing:4px;">
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeJoinModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="joinRoomWithPassword()"><i class="fas fa-sign-in-alt"></i> انضمام</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast Container ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ================================================================
        //  المساحة الصوتية - مع نظام المساعدين (Co-Hosts)
        //  تحكم كامل، مشاركة الصلاحيات مع أصدقائك
        // ================================================================

        // ===== STATE =====
        let state = {
            roomId: null,
            isHost: false,
            isCohost: false,
            isMuted: false,
            participants: [],
            isActive: false,
            cohosts: [] // IDs of co-hosts
        };

        // ===== DOM REFS =====
        const createRoomBtn = document.getElementById('createRoomBtn');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const roomInfo = document.getElementById('roomInfo');
        const shareSection = document.getElementById('shareSection');
        const roomPasswordInput = document.getElementById('roomPasswordInput');
        const inviteLinkInput = document.getElementById('inviteLinkInput');
        const participantCount = document.getElementById('participantCount');
        const speakerCount = document.getElementById('speakerCount');
        const hostCount = document.getElementById('hostCount');
        const cohostCount = document.getElementById('cohostCount');
        const participantsList = document.getElementById('participantsList');
        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const roomIdDisplay = document.getElementById('roomIdDisplay');
        const cohostPanelBtn = document.getElementById('cohostPanelBtn');
        const cohostPanel = document.getElementById('cohostPanel');
        const cohostList = document.getElementById('cohostList');

        // ===== PARTICLES =====
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 18; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.style.left = Math.random() * 100 + '%';
                const size = 2 + Math.random() * 4;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.animationDuration = (20 + Math.random() * 30) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                el.style.opacity = 0.05 + Math.random() * 0.1;
                container.appendChild(el);
            }
        })();

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle', cohost: 'fa-user-cog' };
            const colors = { success: 'var(--success)', error: 'var(--danger)', info: 'var(--primary)',
                warning: 'var(--warning)', cohost: 'var(--cohost)' };
            toast.innerHTML =
                `<span style="color:${colors[type]||colors.info}"><i class="fas ${icons[type]||icons.info}"></i></span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ===== ROOM FUNCTIONS =====
        function generateRoomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 6; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        function generateParticipantId() {
            return 'user_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
        }

        function getRandomName() {
            const names = ['نورة', 'أحمد', 'سارة', 'محمد', 'فاطمة', 'خالد', 'ريم', 'عبدالله', 'منى', 'عمر', 'ليلى', 'سعيد', 'هدى',
                'ناصر', 'خلود'
            ];
            return names[Math.floor(Math.random() * names.length)];
        }

        function getRandomAvatar(name) {
            const colors = ['#6C63FF', '#00BCD4', '#FF4081', '#FFD740', '#00E676', '#FF6F00', '#D500F9', '#00BFA5'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // ===== CREATE ROOM =====
        function createRoom() {
            const password = roomPasswordInput.value.trim();
            createRoomBtn.disabled = true;
            createRoomBtn.innerHTML = '<span class="spinner"></span> جاري الإنشاء...';
            statusText.textContent = 'جاري الإنشاء...';
            statusBadge.className = 'status-badge';

            setTimeout(() => {
                state.roomId = generateRoomId();
                state.isHost = true;
                state.isCohost = false;
                state.isActive = true;
                state.cohosts = [];

                const hostId = generateParticipantId();
                state.participants = [{
                    id: hostId,
                    name: 'المسؤول 👑',
                    isHost: true,
                    isCohost: false,
                    isSpeaker: true,
                    isSelf: true,
                    avatar: '#FFD700'
                }];

                updateUI();
                showToast(`✅ تم إنشاء الغرفة: ${state.roomId}`, 'success');
                statusText.textContent = 'مباشر 🟢';
                statusBadge.className = 'status-badge';

                createRoomBtn.innerHTML = '<i class="fas fa-plus-circle"></i> غرفة جديدة';
                createRoomBtn.disabled = false;
                joinRoomBtn.style.display = 'none';
                cohostPanelBtn.style.display = 'flex';

                setTimeout(() => {
                    shareSection.classList.add('active');
                    inviteLinkInput.value =
                        `${window.location.origin}${window.location.pathname}?room=${state.roomId}`;
                }, 300);
            }, 1000);
        }

        // ===== JOIN ROOM =====
        function showJoinModal() {
            document.getElementById('joinModal').classList.add('active');
            document.getElementById('joinRoomIdInput').value = '';
            document.getElementById('joinPasswordInput').value = '';
            setTimeout(() => document.getElementById('joinRoomIdInput').focus(), 100);
        }

        function closeJoinModal() {
            document.getElementById('joinModal').classList.remove('active');
        }

        function joinRoomWithPassword() {
            const roomId = document.getElementById('joinRoomIdInput').value.trim().toUpperCase();
            const password = document.getElementById('joinPasswordInput').value.trim();

            if (!roomId) { showToast('الرجاء إدخال رمز الغرفة', 'error'); return; }

            const btn = document.querySelector('#joinModal .modal-actions .btn-primary');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> جاري الانضمام...';

            setTimeout(() => {
                state.roomId = roomId;
                state.isHost = false;
                state.isCohost = false;
                state.isActive = true;
                state.cohosts = [];

                const userId = generateParticipantId();
                state.participants = [{
                    id: userId,
                    name: 'أنت',
                    isHost: false,
                    isCohost: false,
                    isSpeaker: true,
                    isSelf: true,
                    avatar: '#6C63FF'
                }];

                // Simulate other participants
                const count = 2 + Math.floor(Math.random() * 4);
                for (let i = 0; i < count; i++) {
                    const name = getRandomName();
                    state.participants.push({
                        id: generateParticipantId(),
                        name: name,
                        isHost: i === 0 && Math.random() > 0.5,
                        isCohost: i === 1 && Math.random() > 0.6,
                        isSpeaker: i % 2 === 0,
                        isSelf: false,
                        avatar: getRandomAvatar(name)
                    });
                }

                // If there's a host in participants, set it
                const host = state.participants.find(p => p.isHost);
                if (host) {
                    host.name = 'المسؤول 👑';
                }

                updateUI();
                showToast(`✅ تم الانضمام إلى الغرفة ${roomId}`, 'success');
                statusText.textContent = 'مباشر 🟢';
                statusBadge.className = 'status-badge';
                closeJoinModal();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> انضمام';
                joinRoomBtn.style.display = 'none';
                createRoomBtn.innerHTML = '<i class="fas fa-plus-circle"></i> غرفة جديدة';

                // Show cohost panel if user is host or cohost
                const user = state.participants.find(p => p.isSelf);
                if (user && (user.isHost || user.isCohost)) {
                    cohostPanelBtn.style.display = 'flex';
                }

                setTimeout(() => {
                    shareSection.classList.add('active');
                    inviteLinkInput.value =
                        `${window.location.origin}${window.location.pathname}?room=${state.roomId}`;
                }, 300);
            }, 1000);
        }

        // ===== CO-HOST MANAGEMENT =====
        function toggleCohostPanel() {
            const panel = cohostPanel;
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            if (panel.style.display === 'block') renderCohostList();
        }

        function renderCohostList() {
            const cohosts = state.participants.filter(p => p.isCohost && !p.isSelf);
            const nonCohosts = state.participants.filter(p => !p.isCohost && !p.isHost && !p.isSelf);

            if (cohosts.length === 0 && nonCohosts.length === 0) {
                cohostList.innerHTML =
                    '<div style="text-align:center;padding:8px;color:var(--text-muted);font-size:0.7rem;">لا يوجد مشاركين لإضافتهم كمساعدين</div>';
                return;
            }

            let html = '';

            // Current co-hosts
            if (cohosts.length > 0) {
                html +=
                    `<div style="font-size:0.55rem;color:var(--cohost);font-weight:700;margin:4px 0;">المساعدين الحاليين</div>`;
                cohosts.forEach(p => {
                    html += `
                                <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:var(--bg-card);border-radius:6px;margin-bottom:3px;border:1px solid rgba(0,188,212,0.1);">
                                    <span style="font-size:0.7rem;">${p.name}</span>
                                    ${state.isHost ? `<button onclick="removeCohost('${p.id}')" style="background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:0.6rem;"><i class="fas fa-user-minus"></i></button>` : ''}
                                </div>
                            `;
                });
            }

            // Available to promote
            const available = nonCohosts.filter(p => !p.isHost);
            if (available.length > 0 && state.isHost) {
                html += `<div style="font-size:0.55rem;color:var(--text-muted);font-weight:700;margin:4px 0;">إضافة مساعد</div>`;
                available.forEach(p => {
                    html += `
                                <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:var(--bg-card);border-radius:6px;margin-bottom:3px;border:1px solid var(--border);">
                                    <span style="font-size:0.7rem;">${p.name}</span>
                                    <button onclick="promoteToCohost('${p.id}')" style="background:transparent;border:none;color:var(--cohost);cursor:pointer;font-size:0.6rem;"><i class="fas fa-user-plus"></i></button>
                                </div>
                            `;
                });
            }

            cohostList.innerHTML = html;
        }

        function promoteToCohost(userId) {
            const user = state.participants.find(p => p.id === userId);
            if (!user || user.isHost) return;

            user.isCohost = true;
            state.cohosts.push(userId);
            showToast(`✅ ${user.name} أصبح مساعداً`, 'cohost');
            updateUI();
            renderCohostList();
        }

        function removeCohost(userId) {
            const user = state.participants.find(p => p.id === userId);
            if (!user) return;

            user.isCohost = false;
            state.cohosts = state.cohosts.filter(id => id !== userId);
            showToast(`❌ تم إلغاء صلاحيات ${user.name} كمساعد`, 'warning');
            updateUI();
            renderCohostList();
        }

        // ===== PARTICIPANT ACTIONS =====
        function toggleParticipantMute(userId) {
            const user = state.participants.find(p => p.id === userId);
            if (!user || user.isHost) return;

            user.isSpeaker = !user.isSpeaker;
            showToast(`${user.isSpeaker ? '🎤 تم تفعيل' : '🔇 تم كتم'} ${user.name}`, user.isSpeaker ? 'success' :
            'warning');
            updateUI();
        }

        function kickParticipant(userId) {
            const user = state.participants.find(p => p.id === userId);
            if (!user || user.isHost || user.isSelf) return;

            state.participants = state.participants.filter(p => p.id !== userId);
            if (user.isCohost) {
                state.cohosts = state.cohosts.filter(id => id !== userId);
            }
            showToast(`👋 تم طرد ${user.name}`, 'error');
            updateUI();
            renderCohostList();
        }

        // ===== TOGGLE MIC =====
        function toggleMic() {
            state.isMuted = !state.isMuted;
            if (state.isMuted) {
                toggleMicBtn.innerHTML = '<i class="fas fa-microphone-slash"></i> إلغاء الكتم';
                toggleMicBtn.className = 'btn btn-outline';
                showToast('🎤 تم كتم الصوت', 'info');
            } else {
                toggleMicBtn.innerHTML = '<i class="fas fa-microphone"></i> كتم';
                toggleMicBtn.className = 'btn btn-success';
                showToast('🎤 تم إلغاء الكتم', 'success');
            }
        }

        // ===== CLOSE ROOM =====
        function closeRoom() {
            if (!state.isActive) return;

            const user = state.participants.find(p => p.isSelf);
            if (state.isHost || (user && user.isCohost)) {
                if (!confirm('هل أنت متأكد من إغلاق الغرفة؟ سيتم طرد جميع المشاركين.')) return;
            } else {
                if (!confirm('هل تريد مغادرة الغرفة؟')) return;
            }

            const isHostClosing = state.isHost || (user && user.isCohost);
            showToast(isHostClosing ? '🔒 تم إغلاق الغرفة' : '👋 تم مغادرة الغرفة', 'warning');

            state.isActive = false;
            state.participants = [];
            state.roomId = null;
            state.isHost = false;
            state.isCohost = false;
            state.cohosts = [];
            state.isMuted = false;

            roomInfo.classList.remove('active');
            shareSection.classList.remove('active');
            joinRoomBtn.style.display = 'block';
            createRoomBtn.innerHTML = '<i class="fas fa-plus-circle"></i> إنشاء الغرفة';
            statusText.textContent = 'جاهز';
            statusBadge.className = 'status-badge';
            cohostPanelBtn.style.display = 'none';
            cohostPanel.style.display = 'none';
            toggleMicBtn.innerHTML = '<i class="fas fa-microphone"></i> كتم';
            toggleMicBtn.className = 'btn btn-success';
        }

        // ===== UI UPDATE =====
        function updateUI() {
            roomInfo.classList.add('active');

            const speakers = state.participants.filter(p => p.isSpeaker);
            const hosts = state.participants.filter(p => p.isHost);
            const cohosts = state.participants.filter(p => p.isCohost);

            participantCount.textContent = state.participants.length;
            speakerCount.textContent = speakers.length;
            hostCount.textContent = hosts.length;
            cohostCount.textContent = cohosts.length;
            roomIdDisplay.textContent = `#${state.roomId || '---'}`;

            // Render participants
            participantsList.innerHTML = state.participants.map(p => {
                let roleClass = 'listener';
                let roleText = 'مستمع';
                if (p.isHost) { roleClass = 'host';
                    roleText = 'مسؤول'; } else if (p.isCohost) { roleClass = 'cohost';
                    roleText = 'مساعد'; } else if (p.isSpeaker) { roleClass = 'speaker';
                    roleText = 'متحدث'; }

                const avatarClass = p.isHost ? 'host' : p.isCohost ? 'cohost' : p.isSelf ? 'self' : p.isSpeaker ?
                    'speaker' : 'listener';
                const avatarContent = p.isHost ? '👑' : p.isCohost ? '🤝' : p.name.charAt(0);

                // Actions for host/cohost
                let actions = '';
                const user = state.participants.find(u => u.isSelf);
                const canManage = user && (user.isHost || user.isCohost);

                if (canManage && !p.isSelf && !p.isHost) {
                    actions = `
                                <div class="participant-actions">
                                    <button class="speaker-btn" onclick="toggleParticipantMute('${p.id}')" title="${p.isSpeaker ? 'كتم' : 'تفعيل'}">
                                        <i class="fas ${p.isSpeaker ? 'fa-microphone' : 'fa-microphone-slash'}"></i>
                                    </button>
                                    ${user.isHost ? `<button class="cohost-btn" onclick="promoteToCohost('${p.id}')" title="تعيين مساعد"><i class="fas fa-user-cog"></i></button>` : ''}
                                    <button class="kick-btn" onclick="kickParticipant('${p.id}')" title="طرد"><i class="fas fa-times"></i></button>
                                </div>
                            `;
                }

                return `
                            <div class="participant-item">
                                <div class="avatar ${avatarClass}">${avatarContent}</div>
                                <div class="name">
                                    ${p.name}
                                    ${p.isSelf ? '<span class="me">(أنت)</span>' : ''}
                                </div>
                                <span class="role ${roleClass}">${roleText}</span>
                                ${actions}
                            </div>
                        `;
            }).join('');

            // Show/hide cohost button
            const user = state.participants.find(p => p.isSelf);
            if (user && (user.isHost || user.isCohost)) {
                cohostPanelBtn.style.display = 'flex';
            } else {
                cohostPanelBtn.style.display = 'none';
                cohostPanel.style.display = 'none';
            }

            statusText.textContent = state.isActive ? 'مباشر 🟢' : 'جاهز';
            statusBadge.className = `status-badge ${!state.isActive ? 'inactive' : ''}`;
        }

        // ===== SHARE FUNCTIONS =====
        function copyInviteLink() {
            const link = inviteLinkInput.value;
            if (!link) { showToast('لا يوجد رابط للمشاركة', 'error'); return; }
            navigator.clipboard.writeText(link).then(() => {
                showToast('✅ تم نسخ الرابط', 'success');
                const btn = inviteLinkInput.nextElementSibling;
                btn.textContent = '✅ تم';
                setTimeout(() => btn.textContent = '<i class="fas fa-copy"></i> نسخ', 2000);
            }).catch(() => {
                inviteLinkInput.select();
                document.execCommand('copy');
                showToast('✅ تم نسخ الرابط', 'success');
            });
        }

        function shareWhatsApp() {
            const link = inviteLinkInput.value;
            if (!link) { showToast('لا يوجد رابط للمشاركة', 'error'); return; }
            const text = encodeURIComponent(`انضم إلى غرفتي الصوتية: ${link}`);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function shareTelegram() {
            const link = inviteLinkInput.value;
            if (!link) { showToast('لا يوجد رابط للمشاركة', 'error'); return; }
            const text = encodeURIComponent(`انضم إلى غرفتي الصوتية: ${link}`);
            window.open(`https://t.me/share/url?url=${text}`, '_blank');
        }

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('joinModal').classList.contains('active')) {
                joinRoomWithPassword();
            }
            if (e.key === 'Escape') closeJoinModal();
            if (e.key === ' ' && state.isActive && document.activeElement?.tagName !== 'INPUT') {
                e.preventDefault();
                toggleMic();
            }
        });

        // ===== AUTO-JOIN =====
        (function autoJoinFromURL() {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            if (room) {
                setTimeout(() => {
                    document.getElementById('joinRoomIdInput').value = room;
                    joinRoomWithPassword();
                }, 800);
            }
        })();

        // ===== INIT =====
        console.log('🎤 المساحة الصوتية - مع نظام المساعدين');
        updateUI();
    </script>

</body>
</html>
